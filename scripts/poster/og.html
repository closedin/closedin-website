<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
  @font-face { font-family: "Inter"; src: url("/case-study-showcase/assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; background: #fff; position: relative; font-family: Inter, -apple-system, sans-serif; color: #1d1d1f; overflow: hidden; }
  .og__band { position: absolute; inset: 0 0 0 640px; background: #f3f3f3; }
  .og__mark { position: absolute; right: 60px; top: 55px; width: 520px; height: 520px; }
  .og__brand { position: absolute; left: 72px; top: 72px; height: 30px; }
  .og__title { position: absolute; left: 72px; top: 200px; width: 520px; font-size: 56px; font-weight: 600; letter-spacing: -0.022em; line-height: 1.05; margin: 0; }
  .og__sub { position: absolute; left: 72px; top: 440px; width: 520px; font-size: 24px; letter-spacing: -0.015em; line-height: 1.35; color: #6e6e73; margin: 0; }
  .og__pill { position: absolute; left: 72px; bottom: 64px; display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 999px; background: #0066cc; color: #fff; font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
</style></head><body>
<div class="og">
  <div class="og__band"></div>
  <img class="og__mark" src="/case-study-showcase/assets/img/mark-poster.png" alt="">
  <img class="og__brand" src="/case-study-showcase/assets/brand/closedin-wordmark-ink.png" alt="">
  <h1 class="og__title">Scale Your Outreach Without Scaling Your Team</h1>
  <p class="og__sub">GTM engineering for B2B outbound. Amsterdam.</p>
  <span class="og__pill">closedin.io</span>
</div>
</body></html>
